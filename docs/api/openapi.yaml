openapi: 3.1.0
info:
  title: Fintracker API
  version: 1.0.0
  description: |
    Contrato HTTP da Fintracker API (v1).

    Convenções:
    - Prefixo de todas as rotas de negócio: `/api/v1`.
    - Autenticação via JWT no header `Authorization: Bearer <token>` (token expira em 45 min).
      Apenas `/users/register`, `/users/login` e `/test` são públicos.
    - Valores monetários trafegam como **string no formato BRL**: `R$ 1.234,56`.
    - Datas trafegam como **string `DD/MM/YYYY`** (ex.: `13/11/2025`).
    - Campos em camelCase no JSON.
    - Erros de domínio retornam `{"detail": "<mensagem>"}`; erros de schema retornam 422 padrão FastAPI.
servers:
  - url: http://localhost:8008
    description: Docker Compose local

tags:
  - name: health
  - name: users
  - name: transactions
  - name: categories
  - name: dashboards

security:
  - bearerAuth: []

paths:
  /api/v1/test:
    get:
      tags: [health]
      summary: Healthcheck simples
      operationId: testEndpoint
      security: []
      responses:
        "200":
          description: API no ar
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    example: "The API is working :)"

  /metrics:
    get:
      tags: [health]
      summary: Métricas Prometheus
      operationId: metrics
      security: []
      responses:
        "200":
          description: Métricas no formato de exposição Prometheus
          content:
            text/plain:
              schema:
                type: string

  # ---------------------------------------------------------------- users
  /api/v1/users/register:
    post:
      tags: [users]
      summary: Cadastra usuário
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Usuário criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPublicResponse"
        "400":
          description: |
            `The passwords don't match` (senha ≠ confirmPassword) ou
            `User with these infos already exists`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/login:
    post:
      tags: [users]
      summary: Autentica e emite JWT
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Token emitido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Senha inválida (`User <username> with invalid credentials`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Usuário não existe (`User with <username> was not found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  # --------------------------------------------------------- transactions
  /api/v1/transactions/:
    get:
      tags: [transactions]
      summary: Lista transações do usuário autenticado (paginado + filtros)
      operationId: listTransactions
      parameters:
        - name: month
          in: query
          description: |
            Mês (1-12) da `registrationDate`. Com `year` filtra mês/ano exato;
            sozinho filtra o mês em qualquer ano.
          schema: { type: integer, minimum: 1, maximum: 12 }
        - name: year
          in: query
          description: Ano da `registrationDate`.
          schema: { type: integer, example: 2025 }
        - name: description
          in: query
          description: Busca parcial, case-insensitive (ILIKE `%valor%`).
          schema: { type: string }
        - name: category
          in: query
          description: Nome exato da categoria, case-insensitive.
          schema: { type: string }
        - name: typeOfTransaction
          in: query
          schema:
            $ref: "#/components/schemas/TypeOfTransaction"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/TransactionStatus"
        - name: itemsPerPage
          in: query
          description: Tamanho da página (sem limite máximo nesta rota).
          schema: { type: integer, default: 10 }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
      responses:
        "200":
          description: Página de transações
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedTransactions"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [transactions]
      summary: Cria transação
      operationId: createTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveTransactionRequest"
      responses:
        "201":
          description: Transação criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "400":
          $ref: "#/components/responses/TransactionBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Usuário ou categoria (`Category <nome> not found`) inexistente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/transactions/{transaction_id}:
    parameters:
      - $ref: "#/components/parameters/TransactionId"
    get:
      tags: [transactions]
      summary: Busca uma transação
      operationId: getTransaction
      responses:
        "200":
          description: Transação
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Usuário ou transação (`Transaction with id <id> not found`) inexistente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [transactions]
      summary: Substitui transação (update completo)
      operationId: updateTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveTransactionRequest"
      responses:
        "200":
          description: Transação atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "400":
          $ref: "#/components/responses/TransactionBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Usuário ou categoria inexistente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          description: |
            Erro genérico. Hoje ocorre quando `transaction_id` não existe
            (use case não valida existência antes do update).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [transactions]
      summary: Remove transação
      operationId: deleteTransaction
      responses:
        "204":
          description: Removida, sem corpo
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Usuário ou transação inexistente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  # ----------------------------------------------------------- categories
  /api/v1/categories/:
    get:
      tags: [categories]
      summary: Lista categorias (globais, paginado)
      operationId: listCategories
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: itemsPerPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
      responses:
        "200":
          description: Página de categorias
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedCategories"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [categories]
      summary: Cria categoria
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveCategoryRequest"
      responses:
        "201":
          description: Categoria criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "400":
          description: Nome duplicado (`Category <nome> already exists`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/categories/{category_id}:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    get:
      tags: [categories]
      summary: Busca uma categoria
      operationId: getCategory
      responses:
        "200":
          description: Categoria
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/CategoryNotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [categories]
      summary: Atualiza parcialmente categoria
      operationId: updateCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryRequest"
      responses:
        "200":
          description: Categoria atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "400":
          description: Novo nome já usado por outra categoria
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/CategoryNotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [categories]
      summary: Remove categoria
      operationId: deleteCategory
      responses:
        "204":
          description: Removida, sem corpo
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/CategoryNotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  # ----------------------------------------------------------- dashboards
  /api/v1/dashboards/:
    get:
      tags: [dashboards]
      summary: Resumo financeiro mensal e anual do usuário
      operationId: getDashboardResume
      parameters:
        - name: month
          in: query
          description: Mês de referência (1-12). Default = mês atual.
          schema: { type: integer, minimum: 1, maximum: 12 }
        - name: year
          in: query
          description: Ano de referência. Default = ano atual.
          schema: { type: integer }
      responses:
        "200":
          description: Totais do período
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/dashboards/monthly:
    get:
      tags: [dashboards]
      summary: Receitas e despesas de cada mês do ano (gráficos de barras e de linha)
      description: |
        Sempre 12 meses (jan→dez). Mês sem lançamentos vem com 0. Soma pela data de
        lançamento (`registration_date`), qualquer status. Valores em número; o front formata em R$.
      operationId: getDashboardMonthlySummary
      parameters:
        - name: year
          in: query
          description: Ano de referência. Default = ano atual.
          schema: { type: integer, minimum: 1, maximum: 9999 }
      responses:
        "200":
          description: Totais mês a mês
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlySummaryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/dashboards/expenses-by-category:
    get:
      tags: [dashboards]
      summary: Despesas do mês por categoria (gráfico de pizza)
      description: |
        Só despesas, pela data de lançamento (`registration_date`), qualquer status. Ordenado do
        maior para o menor gasto. Despesas sem categoria aparecem como `Sem categoria`. Percentuais
        com 2 casas, somando exatamente 100 (diferença de arredondamento vai para a maior fatia).
        Mês sem despesas → `categories: []` e `total: 0`.
      operationId: getDashboardExpensesByCategory
      parameters:
        - name: month
          in: query
          description: Mês de referência (1-12). Default = mês atual.
          schema: { type: integer, minimum: 1, maximum: 12 }
        - name: year
          in: query
          description: Ano de referência. Default = ano atual.
          schema: { type: integer, minimum: 1, maximum: 9999 }
      responses:
        "200":
          description: Fatias por categoria
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpensesByCategoryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Header `Authorization: <tokenType> <accessToken>`. Payload: `sub` (username),
        `name`, `iat`, `exp` (+45 min).

  parameters:
    TransactionId:
      name: transaction_id
      in: path
      required: true
      schema: { type: integer }
    CategoryId:
      name: category_id
      in: path
      required: true
      schema: { type: integer }

  schemas:
    # ---------- primitivos
    BrlAmount:
      type: string
      pattern: '^R\$\s?\d{1,3}(\.\d{3})*,\d{2}$'
      example: "R$ 1.234,56"
      description: Valor monetário no formato BRL.
    BrDate:
      type: string
      pattern: '^\d{2}/\d{2}/\d{4}$'
      example: "13/11/2025"
      description: Data no formato DD/MM/YYYY.
    TypeOfTransaction:
      type: string
      enum: [income, expense]
    TransactionStatus:
      type: string
      enum: [received, not_paid, paying, already_paid]
      description: |
        `income` aceita só `received`.
        `expense` aceita `not_paid`, `paying`, `already_paid`.

    # ---------- erros
    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          example: "Transaction with id 42 not found"
    ValidationErrorResponse:
      type: object
      properties:
        detail:
          type: array
          items:
            type: object
            properties:
              loc:
                type: array
                items: { oneOf: [{ type: string }, { type: integer }] }
              msg: { type: string }
              type: { type: string }

    # ---------- paginação
    PaginationMeta:
      type: object
      required: [page, totalItems, totalOfPages, itemsPerPage, prev, next]
      properties:
        page: { type: integer, example: 1 }
        totalItems: { type: integer, example: 23 }
        totalOfPages:
          type: integer
          description: Mínimo 1, mesmo sem itens.
          example: 3
        itemsPerPage: { type: integer, example: 10 }
        prev: { type: [integer, "null"], example: null }
        next: { type: [integer, "null"], example: 2 }

    # ---------- users
    CreateUserRequest:
      type: object
      required: [username, email, password, confirmPassword]
      properties:
        username: { type: string, example: johndoe }
        email: { type: string, format: email, example: user@example.com }
        password: { type: string, format: password }
        confirmPassword:
          type: string
          format: password
          description: Deve ser igual a `password`, senão 400.
    UserPublicResponse:
      type: object
      required: [username, email]
      properties:
        username: { type: string }
        email: { type: string, format: email }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    TokenResponse:
      type: object
      required: [accessToken, tokenType]
      properties:
        accessToken: { type: string, example: "eyJhbGciOi..." }
        tokenType: { type: string, example: Bearer }

    # ---------- transactions
    SaveTransactionRequest:
      type: object
      required: [description, amount, typeOfTransaction, registrationDate, category, status]
      properties:
        description: { type: string, example: Aluguel }
        amount:
          $ref: "#/components/schemas/BrlAmount"
        typeOfTransaction:
          $ref: "#/components/schemas/TypeOfTransaction"
        registrationDate:
          $ref: "#/components/schemas/BrDate"
        dueDate:
          description: Obrigatório quando `typeOfTransaction = expense`.
          oneOf:
            - $ref: "#/components/schemas/BrDate"
            - type: "null"
        category:
          type: string
          description: Nome de categoria existente.
          example: Moradia
        status:
          $ref: "#/components/schemas/TransactionStatus"
    TransactionResponse:
      type: object
      required:
        [id, description, amount, typeOfTransaction, status, registrationDate, dueDate, categoryId]
      properties:
        id: { type: integer, example: 42 }
        description: { type: string, example: Aluguel }
        amount:
          $ref: "#/components/schemas/BrlAmount"
        typeOfTransaction:
          $ref: "#/components/schemas/TypeOfTransaction"
        status:
          $ref: "#/components/schemas/TransactionStatus"
        registrationDate:
          $ref: "#/components/schemas/BrDate"
        dueDate:
          type: string
          description: DD/MM/YYYY, ou string vazia `""` quando ausente.
          example: "10/12/2025"
        categoryId: { type: [integer, "null"], example: 3 }
    PaginatedTransactions:
      allOf:
        - $ref: "#/components/schemas/PaginationMeta"
        - type: object
          required: [transactions]
          properties:
            transactions:
              type: array
              items:
                $ref: "#/components/schemas/TransactionResponse"

    # ---------- categories
    SaveCategoryRequest:
      type: object
      required: [name, description]
      properties:
        name: { type: string, example: Moradia }
        description: { type: string, example: Aluguel, condomínio, contas da casa }
    UpdateCategoryRequest:
      type: object
      properties:
        name: { type: [string, "null"] }
        description: { type: [string, "null"] }
    CategoryResponse:
      type: object
      required: [categoryId, name, description]
      properties:
        categoryId: { type: integer, example: 3 }
        name: { type: string }
        description: { type: string }
    PaginatedCategories:
      allOf:
        - $ref: "#/components/schemas/PaginationMeta"
        - type: object
          required: [results]
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/CategoryResponse"

    # ---------- dashboards
    DashboardResponse:
      type: object
      required:
        [monthlyRevenues, monthlyExpenses, monthlyBalance, yearlyRevenues, yearlyExpenses, yearlyBalance]
      description: Balance = receitas − despesas. Pode ser negativo (`R$ -150,00`).
      properties:
        monthlyRevenues: { $ref: "#/components/schemas/BrlAmount" }
        monthlyExpenses: { $ref: "#/components/schemas/BrlAmount" }
        monthlyBalance: { type: string, example: "R$ 850,00" }
        yearlyRevenues: { $ref: "#/components/schemas/BrlAmount" }
        yearlyExpenses: { $ref: "#/components/schemas/BrlAmount" }
        yearlyBalance: { type: string, example: "R$ 10.200,00" }

    MonthlySummaryResponse:
      type: object
      required: [year, months]
      properties:
        year: { type: integer, example: 2024 }
        months:
          type: array
          minItems: 12
          maxItems: 12
          items:
            type: object
            required: [month, income, expense]
            properties:
              month: { type: integer, minimum: 1, maximum: 12, example: 3 }
              income: { type: number, example: 5000.0 }
              expense: { type: number, example: 1200.5 }

    ExpensesByCategoryResponse:
      type: object
      required: [month, year, total, categories]
      properties:
        month: { type: integer, example: 3 }
        year: { type: integer, example: 2025 }
        total: { type: number, example: 1000.0 }
        categories:
          type: array
          items:
            type: object
            required: [category, amount, percentage]
            properties:
              category: { type: string, example: "Saúde" }
              amount: { type: number, example: 100.0 }
              percentage: { type: number, example: 10.0 }

  responses:
    Unauthorized:
      description: |
        `Authorization header is missing`, `Token is invalid` ou `Token is expired`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UserNotFound:
      description: Usuário do token não existe mais (`User <username> not found`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    CategoryNotFound:
      description: "`Category with id <id> not found`"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TransactionBadRequest:
      description: |
        Regra de negócio violada:
        - `Formato incorreto para o valor. Deve ter o formato R$ 1.000,00`
        - `Formato incorreto para a data. Deve ter o formato DD/MM/YYYY. Exemplo: 13/11/2025`
        - `O status não é válido para receitas` / `O status não é válido para despesas`
        - `A data de vencimento deve ser informada para despesas`
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Payload/parâmetros fora do schema (padrão FastAPI)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
    InternalError:
      description: "`An unexpected error occurred. Please try again later.`"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

name: CI/CD - Fintracker

on:
  push:
    branches: [main]

env:
  DOCKER_IMAGE: jvrochadev/fintracker

jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installing dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Running tests
        # app.infra.configs.settings.Settings is read at import time, and there is
        # no .env on the runner; these are test-only values (same as docker-compose.test.yaml)
        env:
          POSTGRES_USER: fintracker_test
          POSTGRES_PASSWORD: fintracker_test
          POSTGRES_DB: fintracker_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          JWT_SECRET_KEY: test-only-secret-key
          ALGORITHM: HS256
          TOKEN_TYPE: Bearer
          GH_TOKEN: not-used-in-tests
        run: |
          pytest --tb=short -q

  versioning:
    runs-on: self-hosted
    needs: test
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    outputs:
      released: ${{ steps.semrel.outputs.released }}
      version: ${{ steps.semrel.outputs.version }}
      tag: ${{ steps.semrel.outputs.tag }}
    steps:
      - name: Code checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Python Semantic Release
        id: semrel
        uses: python-semantic-release/python-semantic-release@v10.5.3
        with:
          github_token: ${{ secrets.RELEASE_TOKEN }}
          verbosity: "2"
          git_committer_name: "github-actions"
          git_committer_email: "actions@users.noreply.github.com"

  # Deployment is done by ArgoCD: the release commit updates newTag in
  # k8s/kustomization.yaml and ArgoCD syncs it to the cluster.
  build-and-push:
    runs-on: self-hosted
    needs: versioning
    if: needs.versioning.outputs.released == 'true'
    outputs:
      image_tag: ${{ needs.versioning.outputs.version }}
    steps:
      - name: Code checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.versioning.outputs.tag }}

      - name: Docker Hub authentication
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ needs.versioning.outputs.version }}
            ${{ env.DOCKER_IMAGE }}:latest
